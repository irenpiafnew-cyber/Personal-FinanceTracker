<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Назва сайту</title>
<meta name="description" content="Короткий опис">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f1ea; --fg:#141414; --accent:#c8553d; --muted:#6b6b6b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f0f; --fg:#f1ede6; --muted:#9a9a9a; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:400 1.05rem/1.6 Inter, sans-serif; }
  h1,h2 { font-family:Fraunces, serif; line-height:1; letter-spacing:-.03em; }
  h1 { font-size:clamp(3rem, 10vw, 9rem); }
  h2 { font-size:clamp(2rem, 5vw, 4.5rem); margin-bottom:1.5rem; }
  section { min-height:100vh; padding:12vh max(16px, 6vw); display:flex; flex-direction:column; justify-content:center; }
  .btn { display:inline-block; margin-top:2rem; padding:1rem 2rem; border-radius:999px; background:var(--fg); color:var(--bg); text-decoration:none; transition:transform .4s cubic-bezier(.16,1,.3,1); }
  .btn:hover { transform:scale(1.05); }
  .reveal { opacity:0; transform:translateY(40px); }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity:1; transform:none; } }
</style>
</head>
<body>
  <section><h1 class="reveal">Великий<br>заголовок</h1><a class="btn reveal" href="#cta">Дія</a></section>
  <section><h2 class="reveal">Про нас</h2><p class="reveal">Текст.</p></section>
  <section id="cta"><h2 class="reveal">Готові почати?</h2><a class="btn reveal" href="mailto:hello@example.com">Написати</a></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const lenis = new Lenis(); (function raf(t){ lenis.raf(t); requestAnimationFrame(raf); })(0);
    gsap.registerPlugin(ScrollTrigger);
    gsap.utils.toArray('.reveal').forEach(el => gsap.to(el, {
      opacity:1, y:0, duration:1.1, ease:'expo.out',
      scrollTrigger:{ trigger:el, start:'top 85%' }
    }));
  }
</script>
</body>
</html>
